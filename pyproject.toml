[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "falcon-ai"
version = "1.0.0"
description = "Falcon AI agentic intelligence platform"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 120
exclude = [".venv", "venv", "build", "dist", "data"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
